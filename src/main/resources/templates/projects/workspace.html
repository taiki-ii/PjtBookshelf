<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>プロジェクト詳細</title>
<style>/* 
    #bookModal {
        display: none;
        position: fixed;
        top: 20%;
        left: 50%;
        transform: translateX(-50%);
        width: 400px;
        padding: 20px;
        background-color: white;
        border: 1px solid #333;
        z-index: 1000;
    }

    #modalOverlay {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.3);
        z-index: 999;
    }
*/
</style>
<link rel="stylesheet" th:href="@{/css/projectWorkspace.css}">
</head>
<body>
	<h1>プロジェクト詳細</h1>
	<h1 th:text="${workspace.project.projectName}"></h1>
	
	<hr>
	
	<div th:if="${view == 'shelf'}">
		<h2>作業棚</h2>
		
		<h3>最近の本</h3>
		<div th:each="book : ${workspace.recentBooks}">
			<span th:text="${book.bookTitle}"></span>
		</div>
	
		<h3>最近のメモ</h3>
		<div th:each="memo : ${workspace.recentMemos}">
			<span th:text="${memo.memoText}"></span>
		</div>	
		<hr>
		
		<a th:href="@{/projects/{projectId}/workspace(projectId=${projectId}, view='shelf', scope='all')}">
			全件表示
		</a>
	</div>
	
	<div th:if="${view == 'books'}">
	    <h2>本一覧</h2>
	    <div th:each="book : ${workspace.allBooks}">
	        <span th:text="${book.bookTitle}"></span>
	    </div>
	</div>
	
	<div th:if="${view == 'memos'}">
	    <h2>メモ一覧</h2>
	    <div th:each="memo : ${workspace.allMemos}">
	        <span th:text="${memo.memoText}"></span>
	    </div>
	</div>
	
	<div th:if="${view == 'details'}">
	    <h2>詳細</h2>
	    <table>
	        <tr th:each="book : ${workspace.allBooks}">
	            <td th:text="${book.bookTitle}"></td>
	            <td th:text="${book.author}"></td>
	        </tr>
	    </table>
	</div>
	
	<p>本件数：<span th:text="${workspace.bookCount}"></span></p>
	<p>メモ件数：<span th:text="${workspace.memoCount}"></span></p>
	<p>最終更新日時：<span th:text="${#temporals.format(workspace.updatedAt, 'yyyy/MM/dd HH:mm')}"></span></p>
	
	<hr>
	
	<!-- 表示タブ切替 -->
	<div>
		<a class="tab"
		   th:href="@{/projects/{projectId}/workspace(projectId=${projectId}, view='shelf')}"
       	   th:classappend="${view == 'shelf'} ? ' active' : ''">作業棚</a>
		<a class="tab"
		   th:href="@{/projects/{projectId}/workspace(projectId=${projectId}, view='books')}"
	       th:classappend="${view == 'books'} ? ' active' : ''">本</a>
	
	    <a class="tab"
	       th:href="@{/projects/{projectId}/workspace(projectId=${projectId}, view='memos')}"
	       th:classappend="${view == 'memos'} ? ' active' : ''">メモ</a>
	
	    <a class="tab"
	       th:href="@{/projects/{projectId}/workspace(projectId=${projectId}, view='details')}"
	       th:classappend="${view == 'details'} ? ' active' : ''">詳細</a>  
     </div>
     
     <hr>
     
	 <!-- 本追加モーダル -->
	<button type="button" id="openBookModal">本追加</button>
	
		<div id="modalOverlay" class="modalOverlay"></div>
		
		<div id="bookModal" class="bookModal"
			 th:style="${isBookModalOpen} ? 'display:block;' : 'display:none;'">
		    <h2>本追加モーダル</h2>
		    <p>手動入力</p>
		    <form th:action="@{/projects/{projectId}/books(projectId=${projectId})}"
		    	  th:object="${bookCreateForm}" 
		    	  method="post">
		    		<label for="bookTitle">題名</label>
		    	  	<input type="text" id="bookTitle" th:field="*{bookTitle}"></br>
					<div th:if="${#fields.hasErrors('bookTitle')}" th:errors="*{bookTitle}" style="color:red;"></div>
		    	  	<label for="author">作者</label>
		    	  	<input type="text" id="author" th:field="*{author}"></br>
		    	  	<label for="company">出版社</label>
		    	  	<input type="text" id="company" th:field="*{company}"></br>
		    	  	<label for="publicationDate">出版日</label>
		    	  	<input type="date" id="publicationDate" th:field="*{publicationDate}"></br>
		    		<button type="submit">追加</button></br>
		    </form>
		    <button type="button" id="closeBookModal">閉じる</button>
		</div>
		
		<hr>
		
		<!-- 本削除モーダル -->
		<button type="button" id="openBookDeleteModal">本削除</button>
		
			<div id="deleteModalOverlay" class="modalOverlay">

			<div id="bookDeleteModal" class="bookModal"
				 th:style="${isBookModalOpen} ? 'display:block' : 'display:none;'">
				<h2>本削除モーダル</h2>	
				<form id="bookDeleteForm"
					  th:action="@{/projects/{projectId}/books/delete(projectId=${projectId})}"
					  th:object="${bookDeleteForm}"
					  method="post">
					<label for="deleteBookId">削除する本</label>
					<select id="deleteBookId" name="bookId">
						<option value="">選択してください</option>
						<option th:each="book : ${workspace.allBooks}"
								th:value="${book.id}"
								th:text="${book.bookTitle}"
								th:data-has-memos="${book.memos.size() > 0}">
						</option>
					</select>
					
					<button type="submit" id="bookDeleteButton">削除</button></br>
				</form>
				<button type="button" id="closeBookDeleteModal">閉じる</button>
			</div> 
				  	
	<script>
		// 本追加モーダル制御
	    const openBookModalButton = document.getElementById('openBookModal');
	    const closeBookModalButton = document.getElementById('closeBookModal');
	    const bookModal = document.getElementById('bookModal');
	    const modalOverlay = document.getElementById('modalOverlay');
	    
	    openBookModalButton.addEventListener('click', () => {
	        bookModal.style.display = 'block';
	        modalOverlay.style.display = 'block';
	    });
	    closeBookModalButton.addEventListener('click', () => {
	        bookModal.style.display = 'none';
	        modalOverlay.style.display = 'none';
	    });
	    
	    // 本削除モーダル制御
	    const openBookDeleteModalButton = document.getElementById('openBookDeleteModal');
	    const closeBookDeleteModalButton = document.getElementById('closeBookDeleteModal');
	    const bookDeleteModal = document.getElementById('bookDeleteModal');
	    const deleteModalOverlay = document.getElementById('deleteModalOverlay');
	    
	    openBookDeleteModalButton.addEventListener('click' , () =>{
			bookDeleteModal.style.display = 'block';
			deleteModalOverlay.style.display = 'block';
		});
		closeBookDeleteModalButton.addEventListener('click' , () =>{
			bookDeleteModal.style.display = 'none';
			deleteModalOverlay.style.display = 'none';
		});

		//本削除ボタン押下時、ダイアログメッセージ制御
		const bookDeleteButton = document.getElementById('bookDeleteButton');
		const bookDeleteForm = document.getElementById('bookDeleteForm');
		const deleteBookSelect = document.getElementById('deleteBookId');

		bookDeleteButton.addEventListener('click' , function(e) {
			const selectedOption = deleteBookSelect.options[deleteBookSelect.selectedIndex];

			if(!selectedOption.value){
				alert("削除する本を選択してください");
				e.preventDefault();
				return;
			}

			const hasMemos = selectedOption.dataset.hasMemos === "true";

			    let message;

				if (hasMemos) {
					message = "本に紐づいているメモも削除しますがよろしいでしょうか？";
				} else {
					message = "削除してもよろしいでしょうか？";
				}

				if (!confirm(message)) {
					e.preventDefault();
				}
			});
		
	</script>
	
</body>
</html>
